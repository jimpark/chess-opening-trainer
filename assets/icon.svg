<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: an 824 px tile centered in the 1024 px canvas (100 px margin). -->
  <g transform="translate(100 100) scale(0.8046875)">
  <defs>
    <!-- Clip path for the circular chessboard motif behind the knight -->
    <clipPath id="board-circle-clip">
      <circle cx="512" cy="496" r="368" />
    </clipPath>
  </defs>

  <!-- LAYER 1: Rounded Square App Icon Background -->
  <g id="layer-background">
    <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="#0B1966" />

    <!-- Circular 4x4 Chessboard Grid Motif -->
    <g id="chessboard-circle" clip-path="url(#board-circle-clip)">
      <!-- Row 1 (y: 128 to 312) -->
      <rect x="328" y="128" width="184" height="184" fill="#1B3E94" />
      <rect x="696" y="128" width="184" height="184" fill="#1B3E94" />
      <!-- Row 2 (y: 312 to 496) -->
      <rect x="144" y="312" width="184" height="184" fill="#1B3E94" />
      <rect x="512" y="312" width="184" height="184" fill="#1B3E94" />
      <!-- Row 3 (y: 496 to 680) -->
      <rect x="328" y="496" width="184" height="184" fill="#1B3E94" />
      <rect x="696" y="496" width="184" height="184" fill="#1B3E94" />
      <!-- Row 4 (y: 680 to 864) -->
      <rect x="144" y="680" width="184" height="184" fill="#1B3E94" />
      <rect x="512" y="680" width="184" height="184" fill="#1B3E94" />
    </g>
  </g>

  <!-- LAYER 2: Simplified Geometric Chess Knight -->
  <g id="layer-knight">
    <!-- Knight Mane (Flat Tan Back Silhouette) -->
    <path id="knight-mane"
          d="M 592 318
             C 684 352, 710 470, 710 648
             C 690 656, 672 666, 666 680
             L 666 724
             L 550 724
             L 550 318 Z"
          fill="#CBB99C" />

    <!-- Knight Head & Neck (Clean Warm Ivory Silhouette) -->
    <path id="knight-body"
          d="M 442 252
             L 292 406
             C 272 426, 276 458, 298 476
             C 324 498, 362 496, 382 470
             L 394 454
             C 424 458, 456 452, 480 438
             C 482 476, 454 514, 416 558
             C 380 600, 364 654, 364 724
             L 616 724
             C 634 612, 646 472, 608 368
             C 588 314, 530 274, 442 252 Z"
          fill="#F9F4E8" />

    <!-- Subtle Geometric Jaw Shadow Wedge -->
    <path id="knight-jaw-shadow"
          d="M 480 438
             C 506 422, 524 402, 532 384
             C 536 426, 514 468, 466 502
             C 476 480, 482 458, 480 438 Z"
          fill="#CBB99C" />

    <!-- Simple Circular Eye -->
    <circle id="knight-eye" cx="436" cy="338" r="17" fill="#CBB99C" />
  </g>

  <!-- LAYER 3: Two-Tone Flat Pedestal Base -->
  <g id="layer-pedestal">
    <!-- Upper Gold Collar (Left Light Half) -->
    <path d="M 346 724 L 486 724 L 486 796 L 346 796 C 326 796, 318 780, 318 760 C 318 740, 326 724, 346 724 Z"
          fill="#E5AF28" />
    <!-- Upper Gold Collar (Right Shaded Half) -->
    <path d="M 486 724 L 656 724 C 676 724, 684 740, 684 760 C 684 780, 676 796, 656 796 L 486 796 Z"
          fill="#D49B1E" />

    <!-- Lower Plinth Base (Left White Half) -->
    <path d="M 318 796 L 486 796 L 486 868 L 318 868 C 296 868, 288 852, 288 832 C 288 812, 296 796, 318 796 Z"
          fill="#F5F5F5" />
    <!-- Lower Plinth Base (Right Cool Gray Half) -->
    <path d="M 486 796 L 684 796 C 706 796, 714 812, 714 832 C 714 852, 706 868, 684 868 L 486 868 Z"
          fill="#E0E0E0" />
  </g>

  <!-- LAYER 4: Flat Geometric Graduation Cap -->
  <g id="layer-graduation-cap">
    <!-- Cap Skull Band (Left Slate Half) -->
    <path d="M 462 186 L 594 234 L 570 326 C 510 314, 464 286, 438 256 Z"
          fill="#263238" />
    <!-- Cap Skull Band (Right Dark Half) -->
    <path d="M 594 234 L 714 276 L 686 346 C 644 344, 604 336, 570 326 Z"
          fill="#161E22" />

    <!-- Mortarboard Diamond Top -->
    <polygon id="cap-mortarboard"
             points="386,104 644,106 832,268 574,266"
             fill="#263238"
             stroke="#263238" stroke-width="8" stroke-linejoin="round" />

    <!-- Gold Tassel Cord & Drop -->
    <g id="cap-tassel">
      <!-- Diagonal Cord on Mortarboard -->
      <line x1="606" y1="176" x2="764" y2="264"
            stroke="#F4C13D" stroke-width="14" stroke-linecap="round" />
      <!-- Vertical Hanging Cord -->
      <line x1="764" y1="264" x2="764" y2="416"
            stroke="#F4C13D" stroke-width="14" stroke-linecap="round" />
      <!-- Tassel Bead -->
      <circle cx="764" cy="416" r="18" fill="#F4C13D" />
      <!-- Tassel Fringe Trapezoid -->
      <path d="M 752 428 L 776 428 L 784 474 C 785 480, 780 484, 774 484 L 754 484 C 748 484, 743 480, 744 474 Z"
            fill="#F4C13D" />
    </g>
  </g>
  </g>
</svg>
